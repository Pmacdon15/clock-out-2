name: Shift alerts

# Calls the shift-alert cron every 10 minutes. Vercel's Hobby plan only runs
# cron jobs once a day, which is too slow for "forgot to clock out" reminders.
# (On Vercel Pro you can add `*/10 * * * *` for /api/cron/shift-alerts to
# vercel.json instead and delete this workflow.)
#
# Needs two repository secrets: APP_URL (e.g. https://clockout.patmac.ca)
# and CRON_SECRET (the same value as the app's CRON_SECRET env var).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run shift alerts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/shift-alerts"
