name: ci-debug

on:
  push:
    branches: [test/full-coverage]

permissions:
  contents: write

defaults:
  run:
    # No -e: every step should run and record its output even if a check fails.
    shell: bash {0}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install > install-output.txt 2>&1; echo "exit=$?" >> install-output.txt
      - run: bunx vitest run --coverage > test-output.txt 2>&1; echo "exit=$?" >> test-output.txt
      - run: (bunx next typegen && bunx tsc --noEmit) > tsc-output.txt 2>&1; echo "exit=$?" >> tsc-output.txt
      - run: bunx biome check tests vitest.config.ts > biome-output.txt 2>&1; echo "exit=$?" >> biome-output.txt
      - run: bunx biome check --write --unsafe . > /dev/null 2>&1; git diff -- tests vitest.config.ts src > biome-fix.diff; true
      - name: Publish results
        run: |
          mkdir -p /tmp/out
          cp install-output.txt test-output.txt tsc-output.txt biome-output.txt biome-fix.diff bun.lock /tmp/out/ || true
          cp coverage/coverage-summary.json /tmp/out/ || true
          echo "$GITHUB_SHA" > /tmp/out/SHA
          cd /tmp/out
          git init -q -b results
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "results $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results:ci-results/full-coverage
