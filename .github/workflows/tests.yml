name: Tests

on:
  pull_request:
  push:
    branches: [master]
  # Lets the Biome workflow re-run this on its own autofix commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The vitest projects run as parallel jobs. Each one saves a blob report
  # with its coverage, and the Coverage job merges them to enforce 100%.
  vitest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: unit
            name: Unit tests
          - project: components
            name: Component tests
          - project: app
            name: App and API route tests
    env:
      # Report only the files this job loads; thresholds are checked after the merge.
      COVERAGE_SHARD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: >-
          bunx vitest run --project ${{ matrix.project }} --coverage
          --reporter=default --reporter=blob
          --outputFile.blob=.vitest-reports/blob-${{ matrix.project }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.project }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage
    needs: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          path: .vitest-reports
          merge-multiple: true
      # Fails if lines, branches, functions or statements drop below 100%.
      - run: >-
          bunx vitest --merge-reports --coverage
          --coverage.reporter=text --coverage.reporter=json
      # The merge only knows files some job loaded; catch any no test imports.
      - run: bun scripts/check-untested-files.ts

  static-shell:
    name: Static shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build prerenders pages but never connects to these.
      DATABASE_URL: postgres://build:build@localhost:5432/build
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
      NEXT_TELEMETRY_DISABLED: 1
      REQUIRE_BUILD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # `next build`, then check every page kept its static shell.
      - run: bun run test:build
